  if(root==='builder'){
    const testId = document.getElementById('builderTestId')?.value;

    const pcEnabled = document.getElementById('pcEnabled'), pcCamera = document.getElementById('pcCamera');
    const syncProctoringUI = ()=>{
      document.getElementById('pcOptions').style.display = pcEnabled.checked ? 'grid' : 'none';
      document.querySelectorAll('#pcSnapshots, #pcFaceDetection, #pcInterval').forEach(el=>{
        const wrap = el.closest('label') || el.closest('div');
        wrap.style.opacity = pcCamera.checked ? '1' : '.4';
        wrap.style.pointerEvents = pcCamera.checked ? 'auto' : 'none';
      });
    };
    pcEnabled?.addEventListener('change', syncProctoringUI);
    pcCamera?.addEventListener('change', syncProctoringUI);
    document.getElementById('saveProctoringBtn')?.addEventListener('click', async (e)=>{
      const proctoring = {
        enabled: document.getElementById('pcEnabled').checked,
        behavior: document.getElementById('pcBehavior').checked,
        fullscreen: document.getElementById('pcFullscreen').checked,
        camera: document.getElementById('pcCamera').checked,
        snapshots: document.getElementById('pcSnapshots').checked,
        faceDetection: document.getElementById('pcFaceDetection').checked,
        snapshotIntervalSec: parseInt(document.getElementById('pcInterval').value) || 45,
      };
      e.target.disabled = true;
      try{ await api.updateTest(testId, {proctoring}); invalidateTests(); render(); toast('Настройки прокторинга сохранены'); }
      catch(err){ toast('Не удалось сохранить: '+err.message, true); e.target.disabled=false; }
    });

    document.getElementById('publishBtn')?.addEventListener('click', async (e)=>{
      try{ const t = await api.publishTest(e.target.dataset.id); invalidateTests(); render(); toast(t.status==='published'?'Тест опубликован':'Тест снят с публикации'); }
      catch(err){ toast('Не удалось изменить публикацию: '+err.message, true); }
    });
    document.getElementById('exportTestBtn')?.addEventListener('click', async (e)=>{
      try{ const data = await api.exportTest(e.target.dataset.id); downloadJSON(data, `agregator-testov-test-${e.target.dataset.id}.json`); }
      catch(err){ toast('Не удалось экспортировать: '+err.message, true); }
    });
    document.getElementById('addSectionBtn')?.addEventListener('click', async (e)=>{
      const test = await api.getTest(e.target.dataset.id);
      test.sections.push({id:uid('S'), title:'0'+(test.sections.length+1)+'. Новый раздел', questionIds:[]});
      try{ await api.updateTest(test.id, {sections:test.sections}); invalidateTests(); render(); }
      catch(err){ toast('Не удалось добавить раздел: '+err.message, true); }
    });
    document.querySelectorAll('.addQSelect').forEach(sel=>{
      sel.addEventListener('change', async e=>{
        const qid=e.target.value; if(!qid) return;
        const test = await api.getTest(testId);
        const sec = test.sections.find(s=>s.id===e.target.dataset.sec);
        sec.questionIds.push(qid);
        try{ await api.updateTest(test.id, {sections:test.sections}); invalidateTests(); render(); toast('Вопрос добавлен'); }
        catch(err){ toast('Не удалось добавить вопрос: '+err.message, true); }
      });
    });
    document.querySelectorAll('[data-remove-q]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const [secId,qid] = b.dataset.removeQ.split('|');
        const test = await api.getTest(testId);
        const sec = test.sections.find(s=>s.id===secId);
        sec.questionIds = sec.questionIds.filter(id=>id!==qid);
        try{ await api.updateTest(test.id, {sections:test.sections}); invalidateTests(); render(); toast('Вопрос удалён из теста'); }
        catch(err){ toast('Не удалось удалить вопрос: '+err.message, true); }
      });
    });
    document.querySelectorAll('[data-remove-sec]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        if(!confirm('Удалить раздел и все вопросы в нём из теста?')) return;
        const test = await api.getTest(testId);
        test.sections = test.sections.filter(s=>s.id!==b.dataset.removeSec);
        try{ await api.updateTest(test.id, {sections:test.sections}); invalidateTests(); render(); }
        catch(err){ toast('Не удалось удалить раздел: '+err.message, true); }
      });
    });
    document.getElementById('testTitleEdit')?.addEventListener('blur', async e=>{
      const title=e.target.textContent.trim(); if(!title) return;
      try{ await api.updateTest(testId, {title}); invalidateTests(); }
      catch(err){ toast('Не удалось сохранить название: '+err.message, true); }
    });
    document.getElementById('timeLimitEdit')?.addEventListener('blur', async e=>{
      const n=parseInt(e.target.textContent); if(!(n>0)) return;
      try{ await api.updateTest(testId, {timeLimitMin:n}); invalidateTests(); render(); }
      catch(err){ toast('Не удалось сохранить: '+err.message, true); }
    });
    document.getElementById('passScoreEdit')?.addEventListener('blur', async e=>{
      const n=parseInt(e.target.textContent); if(!(n>0&&n<=100)) return;
      try{ await api.updateTest(testId, {passScore:n}); invalidateTests(); render(); }
      catch(err){ toast('Не удалось сохранить: '+err.message, true); }
    });
  }

  if(root==='apikeys'){
    document.getElementById('newKeyBtn')?.addEventListener('click', openNewKeyModal);
    document.querySelectorAll('[data-revoke]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        if(!confirm('Отозвать ключ? Все запросы с ним начнут получать 401 Unauthorized.')) return;
        try{ await api.revokeKey(b.dataset.revoke); render(); toast('Ключ отозван'); }
        catch(err){ toast('Не удалось отозвать: '+err.message, true); }
      });
    });
  }

  if(root==='users'){
    const friendlyErr = (e)=>({
      cannot_deactivate_last_admin: 'Нельзя деактивировать последнего активного админа — сначала создайте или назначьте другого',
      cannot_delete_last_admin: 'Нельзя удалить последнего админа',
      cannot_delete_your_own_account: 'Нельзя удалить свою же учётную запись — деактивируйте её с другого админ-аккаунта, если нужно',
      user_has_attempt_history: 'У этого пользователя уже есть попытки/приглашения — удаление запрещено, чтобы не потерять результаты. Деактивируйте вместо удаления',
      email_already_in_use: 'Этот email уже используется',
    }[e.code] || e.message);

    document.getElementById('newUserBtn')?.addEventListener('click', openNewUserModal);
    document.querySelectorAll('[data-edit-user]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const users = await api.listUsers();
        const u = users.find(x=>x.id===b.dataset.editUser);
        if(u) openEditUserModal(u);
      });
    });
    document.querySelectorAll('[data-toggle-user]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const willDeactivate = b.dataset.active==='true';
        if(willDeactivate && !confirm('Деактивировать пользователя? Он не сможет войти, но история его попыток сохранится.')) return;
        try{ await api.updateUser(b.dataset.toggleUser, {active: !willDeactivate}); render(); toast(willDeactivate?'Пользователь деактивирован':'Пользователь активирован'); }
        catch(e){ toast(friendlyErr(e), true); }
      });
    });
    document.querySelectorAll('[data-delete-user]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        if(!confirm('Удалить пользователя безвозвратно? Это возможно только если у него нет попыток/приглашений.')) return;
        try{ await api.deleteUser(b.dataset.deleteUser); render(); toast('Пользователь удалён'); }
        catch(e){ toast(friendlyErr(e), true); }
      });
    });
  }

  if(root==='campaigns' && !p1){
    document.getElementById('newCampaignBtn')?.addEventListener('click', openNewCampaignModal);
  }

  if(root==='campaigns' && p1){
    const cid = document.getElementById('campaignDetailId')?.value || p1;
    document.getElementById('activateBtn')?.addEventListener('click', async ()=>{
      try{ await api.updateCampaign(cid, {status:'active'}); render(); toast('Кампания запущена'); }
      catch(e){ toast('Не удалось запустить: '+e.message, true); }
    });
    document.getElementById('completeBtn')?.addEventListener('click', async ()=>{
      try{ await api.updateCampaign(cid, {status:'completed'}); render(); toast('Кампания завершена'); }
      catch(e){ toast('Не удалось завершить: '+e.message, true); }
    });
    document.getElementById('archiveBtn')?.addEventListener('click', async ()=>{
      if(!confirm('Архивировать кампанию? Приглашённые обучающиеся сохранят доступ к своим результатам.')) return;
      try{ await api.updateCampaign(cid, {status:'archived'}); render(); toast('Кампания заархивирована'); }
      catch(e){ toast('Не удалось архивировать: '+e.message, true); }
    });
    document.getElementById('deleteCampaignBtn')?.addEventListener('click', async ()=>{
      if(!confirm('Удалить кампанию? Приглашения будут удалены, но результаты обучающихся останутся.')) return;
      try{ await api.deleteCampaign(cid); go('#/campaigns'); toast('Кампания удалена'); }
      catch(e){ toast('Не удалось удалить: '+e.message, true); }
    });
    document.getElementById('bulkInviteBtn')?.addEventListener('click', async (e)=>{
      const raw = document.getElementById('inviteEmails').value.trim();
      if(!raw){ toast('Введите хотя бы один email'); return; }
      e.target.disabled = true;
      try{
        const result = await api.bulkInviteCampaign(cid, raw);
        render();
        const parts = [];
        if(result.invited.length) parts.push(`приглашено: ${result.invited.length}`);
        if(result.alreadyInvited.length) parts.push(`уже были приглашены: ${result.alreadyInvited.length}`);
        if(result.notFound.length) parts.push(`не найдены как обучающиеся: ${result.notFound.join(', ')}`);
        toast(parts.join(' · ') || 'Готово');
      }catch(err){ toast('Не удалось пригласить: '+err.message, true); e.target.disabled=false; }
    });
  }

  if(root==='reports'){
    document.getElementById('repApply')?.addEventListener('click', ()=>{
      reportsState.from = document.getElementById('repFrom').value;
      reportsState.to = document.getElementById('repTo').value;
      render();
    });
    const doDownload = async (btn, path, fallbackName)=>{
      const original = btn.textContent; btn.disabled = true; btn.textContent = 'Формирование…';
      try{
        const qs = new URLSearchParams();
        if(reportsState.from) qs.set('from', reportsState.from);
        if(reportsState.to) qs.set('to', reportsState.to);
        const {blob, filename} = await apiFetchBlob(path + (qs.toString()?'?'+qs.toString():''));
        downloadBlob(blob, filename||fallbackName);
      }catch(e){ toast('Не удалось скачать отчёт: '+e.message, true); }
      finally{ btn.disabled=false; btn.textContent=original; }
    };
    document.getElementById('dlAttemptsCsv')?.addEventListener('click', (e)=>doDownload(e.target,'/reports/attempts.csv','attempts_report.csv'));
    document.getElementById('dlQuestionsCsv')?.addEventListener('click', (e)=>doDownload(e.target,'/reports/questions.csv','questions_report.csv'));
    document.getElementById('dlSummaryPdf')?.addEventListener('click', (e)=>doDownload(e.target,'/reports/summary.pdf','summary_report.pdf'));
  }

  if(root==='notifications'){
    document.querySelectorAll('.notif-item').forEach(el=>{
      el.addEventListener('click', async ()=>{
        if(el.dataset.read==='false'){
          try{ await api.readNotification(el.dataset.nid); }catch(e){ /* still navigate */ }
        }
        if(el.dataset.link) go(el.dataset.link); else render();
      });
    });
    document.getElementById('readAllBtn')?.addEventListener('click', async ()=>{
      try{ await api.readAllNotifications(); render(); }
      catch(e){ toast('Не удалось обновить: '+e.message, true); }
    });
  }

  if(root==='settings'){
    const picker = document.getElementById('stColorPicker'), hex = document.getElementById('stColorHex');
    picker?.addEventListener('input', ()=>{ hex.value = picker.value; });
    hex?.addEventListener('input', ()=>{ if(/^#[0-9A-Fa-f]{6}$/.test(hex.value)) picker.value = hex.value; });

    document.getElementById('saveSettingsBtn')?.addEventListener('click', async (e)=>{
      const colorVal = hex.value.trim();
      if(!/^#[0-9A-Fa-f]{6}$/.test(colorVal)){ toast('Цвет должен быть в формате #RRGGBB'); return; }
      const patch = {
        orgName: document.getElementById('stOrgName').value.trim(),
        primaryColor: colorVal,
        defaultTimeLimitMin: parseInt(document.getElementById('stTimeLimit').value),
        defaultPassScore: parseInt(document.getElementById('stPassScore').value),
        minPasswordLength: parseInt(document.getElementById('stMinPass').value),
        accessTokenTtlMin: parseInt(document.getElementById('stAccessTtl').value),
        refreshTokenTtlDays: parseInt(document.getElementById('stRefreshTtl').value),
      };
      if(!patch.orgName){ toast('Название организации не может быть пустым'); return; }
      e.target.disabled = true;
      try{
        const updated = await api.updateSettings(patch);
        ORG_SETTINGS = {...ORG_SETTINGS, ...updated};
        applyBranding();
        toast('Настройки сохранены');
        render();
      }catch(err){
        toast('Не удалось сохранить: '+err.message, true);
      }finally{ e.target.disabled = false; }
    });
  }

  if(root==='proctoring' && p1){
    hydrateSnapshotThumbnails();
    const doReview = async (decision)=>{
      try{
        await api.postProctorReview(p1, decision, document.getElementById('reviewNote').value.trim());
        render(); toast(decision==='flagged' ? 'Помечено как нарушение' : 'Отмечено как проверенное');
      }catch(e){ toast('Не удалось сохранить решение: '+e.message, true); }
    };
    document.getElementById('clearReviewBtn')?.addEventListener('click', ()=>doReview('cleared'));
    document.getElementById('flagReviewBtn')?.addEventListener('click', ()=>doReview('flagged'));
  }

  if(root==='lobby'){
    const checks = [
      {label:'Интернет-соединение', sub:'Проверка скорости соединения'},
      {label:'Браузер', sub:'Проверка совместимости'},
    ];
    const list = document.getElementById('checkList');
    checks.forEach((c,i)=>{
      const row=document.createElement('div');
      row.style.cssText='display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;border:1px solid var(--bord);background:var(--bg)';
      row.innerHTML=`<div style="width:8px;height:8px;border-radius:50%;background:var(--ink3)" class="dot"></div><div style="flex:1"><div style="font-size:12px;font-weight:500">${c.label}</div><div style="font-size:11px;color:var(--ink3)">${c.sub}</div></div><span style="font-size:11px;color:var(--ink3)" class="stat">Проверка…</span>`;
      list.appendChild(row);
      setTimeout(()=>{
        row.querySelector('.dot').style.background='var(--ok)';
        const s=row.querySelector('.stat'); s.textContent='Готово'; s.style.color='var(--ok)'; s.style.fontWeight='600';
      }, 500+i*350);
    });

    const agree=document.getElementById('agreeBox'), startBtn=document.getElementById('startTestBtn');
    const camConsentBox = document.getElementById('camConsentBox'); // null if this test doesn't require a camera
    const updateStartEnabled = ()=>{
      startBtn.disabled = !agree.checked || (!!camConsentBox && !camConsentBox.checked);
    };
    agree.addEventListener('change', updateStartEnabled);

    document.getElementById('enableCamBtn')?.addEventListener('click', async (e)=>{
      const btn=e.target, statusEl=document.getElementById('camStatus');
      btn.disabled=true; btn.textContent='Запрашиваем доступ…';
      try{
        const stream = await navigator.mediaDevices.getUserMedia({video:{width:320,height:240}, audio:false});
        proctorState.stream = stream;
        const video = document.getElementById('camPreview');
        video.srcObject = stream; video.style.display='block';
        document.getElementById('camPlaceholder').style.display='none';
        camConsentBox.disabled = false;
        statusEl.textContent = 'Камера подключена.'; statusEl.style.color='var(--ok)';
        btn.textContent='Камера включена'; 
        camConsentBox.addEventListener('change', updateStartEnabled);
      }catch(err){
        statusEl.textContent = 'Не удалось получить доступ к камере — проверьте разрешения браузера.';
        statusEl.style.color='var(--err)';
        btn.disabled=false; btn.textContent='Повторить';
      }
    });

    startBtn.addEventListener('click', async ()=>{
      startBtn.disabled=true; startBtn.textContent='Запуск…';
      try{
        const consentGiven = !!camConsentBox && camConsentBox.checked;
        const attempt = await api.startAttempt(p1, consentGiven);
        taking.idx=0;
        go('#/test/'+attempt.id);
      }catch(e){
        toast('Не удалось начать тест: '+e.message, true);
        startBtn.disabled=false; startBtn.textContent='▶ Начать тестирование';
      }
    });
  }

  if(root==='test'){
    startTimer();
    const test = taking.test;
    const qMap = taking.questions;
    const qids = allTestQuestionIds(test);
    const qid = qids[taking.idx];
    const q = qMap[qid];

    startProctoringInstrumentation(test, p1);

    document.getElementById('submitTestBtn')?.addEventListener('click', ()=>submitTest(p1,false));
    document.getElementById('prevQBtn')?.addEventListener('click', ()=>{ taking.idx=Math.max(0,taking.idx-1); render(); });
    document.getElementById('nextQBtn')?.addEventListener('click', ()=>{ taking.idx=Math.min(qids.length-1,taking.idx+1); render(); });
    document.getElementById('nextBtn2')?.addEventListener('click', ()=>{
      if(taking.idx<qids.length-1){ taking.idx++; render(); }
      else { toast('Это последний вопрос — нажмите «Завершить тест», когда будете готовы'); }
    });
    document.getElementById('flagBtn')?.addEventListener('click', async ()=>{
      const flagged = (taking.attempt.flagged||[]).slice();
      const i=flagged.indexOf(qid);
      if(i>=0) flagged.splice(i,1); else flagged.push(qid);
      taking.attempt.flagged = flagged;
      render();
      await saveAttemptPatch({flagged});
    });
    document.getElementById('clearAnsBtn')?.addEventListener('click', async ()=>{
      const answers = {...taking.attempt.answers}; delete answers[qid];
      taking.attempt.answers = answers;
      render();
      await saveAttemptPatch({answers:{[qid]: q.type==='multiple' ? [] : ''}});
    });
    document.querySelectorAll('#qGrid button[data-idx]').forEach(b=>{
      b.addEventListener('click', ()=>{ taking.idx=parseInt(b.dataset.idx); render(); });
    });
    if(q.type==='single'){
      document.querySelectorAll('.ansOpt').forEach(el=>{
        el.addEventListener('click', async ()=>{
          taking.attempt.answers = {...taking.attempt.answers, [qid]: el.dataset.opt};
          render();
          await saveAttemptPatch({answers:{[qid]: el.dataset.opt}});
        });
      });
    } else if(q.type==='multiple'){
      document.querySelectorAll('.ansOptMulti').forEach(el=>{
        el.addEventListener('click', async ()=>{
          const cur = Array.isArray(taking.attempt.answers[qid])?taking.attempt.answers[qid].slice():[];
          const opt=el.dataset.opt; const i=cur.indexOf(opt);
          if(i>=0) cur.splice(i,1); else cur.push(opt);
          taking.attempt.answers = {...taking.attempt.answers, [qid]: cur};
          render();
          await saveAttemptPatch({answers:{[qid]: cur}});
        });
      });
    } else {
      const ta=document.getElementById('textAns');
      let debounceT;
      ta?.addEventListener('input', e=>{
        taking.attempt.answers = {...taking.attempt.answers, [qid]: e.target.value};
        clearTimeout(debounceT);
        debounceT = setTimeout(()=>saveAttemptPatch({answers:{[qid]: e.target.value}}), 600);
      });
      ta?.addEventListener('blur', async e=>{
        clearTimeout(debounceT);
        await saveAttemptPatch({answers:{[qid]: e.target.value}});
        toast('Ответ сохранён');
      });
    }
  }
}

    </div>
    <div id="nqOptionsWrap">
      <label class="flabel">Варианты ответа (отметьте правильные)</label>
      <div id="nqOptions"></div>
      <button class="btn sm" id="nqAddOpt" type="button">${ICONS.plus} Добавить вариант</button>
    </div>
    <div class="modal-actions">
      <button class="btn" id="nqCancel">Отмена</button>
      <button class="btn primary" id="nqSave">Сохранить вопрос</button>
    </div>
  </div>`;
  document.body.appendChild(veil);

  let optCount=0;
  function addOpt(text=''){
    optCount++;
    const row=document.createElement('div');
    row.style.cssText='display:flex;gap:8px;align-items:center;margin-bottom:6px';
    row.innerHTML=`<input type="checkbox" class="nqCorrect"><input class="field nqOptText" placeholder="Вариант ${optCount}" value="${esc(text)}" style="flex:1">`;
    document.getElementById('nqOptions').appendChild(row);
  }
  addOpt(); addOpt();
  document.getElementById('nqAddOpt').addEventListener('click', ()=>addOpt());
  document.getElementById('nqType').addEventListener('change', e=>{
    document.getElementById('nqOptionsWrap').style.display = (e.target.value==='single'||e.target.value==='multiple') ? 'block':'none';
  });
  document.getElementById('nqMediaFile').addEventListener('change', e=>{
    const file = e.target.files[0];
    const preview = document.getElementById('nqMediaPreview');
    preview.innerHTML='';
    if(!file) return;
    const limit = file.type==='image/gif'||file.type.startsWith('video')||file.type==='application/json' ? 15*1024*1024 : 5*1024*1024;
    if(file.size>limit){
      toast(`Файл слишком большой: максимум ${Math.round(limit/1024/1024)} МБ для этого типа`, true);
      e.target.value=''; return;
    }
    if(file.type.startsWith('image')){
      const img = document.createElement('img');
      img.style.cssText='max-width:100%;max-height:160px;border-radius:8px;border:1px solid var(--bord)';
      img.src = URL.createObjectURL(file);
      preview.appendChild(img);
    } else {
      preview.innerHTML = `<div style="font-size:12px;color:var(--ink2)">Выбран файл: ${esc(file.name)}</div>`;
    }
  });

  veil.addEventListener('click', e=>{ if(e.target===veil) veil.remove(); });
  document.getElementById('nqCancel').addEventListener('click', ()=>veil.remove());
  document.getElementById('nqSave').addEventListener('click', async ()=>{
    const text=document.getElementById('nqText').value.trim();
    if(!text){ toast('Введите текст вопроса'); return; }
    const type=document.getElementById('nqType').value;
    const skill=document.getElementById('nqSkill').value.trim()||'Общее';
    const difficulty=document.getElementById('nqDiff').value;
    const points=parseInt(document.getElementById('nqPoints').value)||2;
    let options=[];
    if(type==='single'||type==='multiple'){
      document.querySelectorAll('#nqOptions > div').forEach((row,i)=>{
        const t=row.querySelector('.nqOptText').value.trim();
        const c=row.querySelector('.nqCorrect').checked;
        if(t) options.push({id:String.fromCharCode(65+i), text:t, correct:c});
      });
    }
    const saveBtn = document.getElementById('nqSave');
    saveBtn.disabled = true;

    let media = [];
    const file = document.getElementById('nqMediaFile').files[0];
    if(file){
      saveBtn.textContent = 'Загрузка изображения…';
      try{
        const dataBase64 = await readFileAsBase64(file);
        const kind = file.type==='image/gif' ? 'animation' : file.type.startsWith('video') ? 'video' : file.type==='application/json' ? 'animation' : 'image';
        const asset = await api.uploadAsset({filename:file.name, mime:file.type, dataBase64});
        media = [{ assetId: asset.id, url: asset.url, kind, alt: text.slice(0,80) }];
      }catch(e){
        toast('Не удалось загрузить медиафайл: '+e.message, true);
        saveBtn.disabled=false; saveBtn.textContent='Сохранить вопрос';
        return;
      }
    }

    saveBtn.textContent = 'Сохранение…';
    try{
      const q = await api.createQuestion({text, type, skill, difficulty, points, status:'draft', options, media});
      invalidateQuestions();
      bankState.selectedId=q.id;
      veil.remove(); render(); toast('Вопрос добавлен в банк');
    }catch(e){
      toast('Не удалось сохранить: '+e.message, true);
      saveBtn.disabled=false; saveBtn.textContent='Сохранить вопрос';
    }
  });
}

/* ---------------- boot ---------------- */
(async ()=>{ await loadOrgSettings(); render(); })();
</script>
</body>
</html>
